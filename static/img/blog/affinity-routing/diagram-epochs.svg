<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img" aria-label="Three panels: a fresh home becomes stale after a write and returns to fresh after the next read fetches only the new files">
  <style>
    .lbl{font:600 13px ui-sans-serif,system-ui,sans-serif;fill:#1c2733}
    .sub{font:500 11px ui-sans-serif,system-ui,sans-serif;fill:#5a6672}
    .monoink{font:500 10.5px ui-monospace,Menlo,Consolas,monospace;fill:#1c2733}
    .badge{font:500 11px ui-monospace,Menlo,Consolas,monospace}
    @media (prefers-reduced-motion: no-preference){
      .pulse{animation:dpulse 2.4s ease-in-out infinite}
      @keyframes dpulse{0%,100%{opacity:1}50%{opacity:.45}}
    }
  </style>
  <rect x="0.5" y="0.5" width="799" height="209" rx="14" fill="#ffffff" stroke="#e2e5e1"/>
  <defs>
    <marker id="ep-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2733"/>
    </marker>
    <pattern id="ep-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fbe9d7"/>
      <rect width="3" height="6" fill="#e8862e"/>
    </pattern>
  </defs>

  <text x="140" y="28" text-anchor="middle" class="sub">1. fresh</text>
  <rect x="60" y="40" width="160" height="80" rx="10" fill="#ffffff" stroke="#e8862e" stroke-width="2"/>
  <text x="140" y="64" text-anchor="middle" class="lbl">node B</text>
  <rect x="74" y="76" width="132" height="16" rx="4" fill="#e8862e"/>
  <rect x="86" y="130" width="108" height="22" rx="11" fill="#fbe9d7"/>
  <text x="140" y="145" text-anchor="middle" class="badge" fill="#c96a15">writes seen 4/4</text>
  <text x="140" y="176" text-anchor="middle" class="sub">holds the whole table</text>

  <path d="M236,80 L296,80" fill="none" stroke="#1c2733" stroke-width="1.6" marker-end="url(#ep-arr)"/>
  <text x="266" y="66" text-anchor="middle" class="monoink">a write lands</text>

  <text x="400" y="28" text-anchor="middle" class="sub">2. stale: doubted, not evicted</text>
  <rect x="320" y="40" width="160" height="80" rx="10" fill="#ffffff" stroke="#c96a15" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="64" text-anchor="middle" class="lbl">node B</text>
  <rect x="334" y="76" width="112" height="16" rx="4" fill="#e8862e"/>
  <rect x="446" y="76" width="20" height="16" rx="4" fill="#e0edf5" stroke="#4e93be" stroke-dasharray="3 3" class="pulse"/>
  <rect x="346" y="130" width="108" height="22" rx="11" fill="url(#ep-hatch)"/>
  <text x="400" y="145" text-anchor="middle" class="badge" fill="#7a4104">writes seen 4/5</text>
  <text x="400" y="176" text-anchor="middle" class="sub">still ~95% warm, missing only the new files</text>

  <path d="M496,80 L556,80" fill="none" stroke="#1c2733" stroke-width="1.6" marker-end="url(#ep-arr)"/>
  <text x="526" y="66" text-anchor="middle" class="monoink">next read</text>

  <text x="660" y="28" text-anchor="middle" class="sub">3. fresh again</text>
  <rect x="580" y="40" width="160" height="80" rx="10" fill="#ffffff" stroke="#e8862e" stroke-width="2"/>
  <text x="660" y="64" text-anchor="middle" class="lbl">node B</text>
  <rect x="594" y="76" width="132" height="16" rx="4" fill="#e8862e"/>
  <rect x="606" y="130" width="108" height="22" rx="11" fill="#fbe9d7"/>
  <text x="660" y="145" text-anchor="middle" class="badge" fill="#c96a15">writes seen 5/5</text>
  <text x="660" y="176" text-anchor="middle" class="sub">downloaded only the delta</text>
</svg>
